packages:
  - 'packages/*'
  # Runnable example apps. They consume the published entry points (`dist`) of the
  # workspace packages, exactly as a user's project would after `npm install`.
  - 'examples/*'

# Both arrive through `@vscode/vsce` and both are native. Neither is built, on purpose:
# `keytar` stores Marketplace credentials and `vsce-sign` signs a release — the two things
# `vsce publish` does. The extension only ever runs `vsce package` (SDD-25 §4.5), and
# publishing is explicitly out of scope (§7). Compiling native code for a command the repo
# does not run buys nothing and can fail the install on a machine without a toolchain.
allowBuilds:
  '@vscode/vsce-sign': false
  keytar: false

# pnpm >=10 blocks dependency build scripts unless allowlisted here.
# oxc-parser ships a native NAPI binary and needs its build step. Since pnpm 11
# this setting lives in pnpm-workspace.yaml (no longer in package.json).
onlyBuiltDependencies:
  - oxc-parser
